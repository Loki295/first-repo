<!DOCTYPE html>
<html lang="en">
    <body style="background-color: rgb(185, 232, 183);"
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width-device-width", initial-scale=1">
    <title>Reservation of Railway Ticket</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>  
    <h1 align="center">Student Registration Form </b></h1><hr color="black">
     <form class="registrationform">
        <div class="form">
            <label for="roll no.">Roll No:</label>
            <input type="text" id="roll no." name="roll no." placeholder="Enter Roll No.">
            <br>
            <br>
            <label for="name">Student Name:</label>
            <input type="text" id="name" name="..." placeholder="Enter First name">
            <input type="text" id="." name=".." placeholder="Enter Second name">
            <br>
            <br>
            <label for="name">Father Name:</label>
            <input type="text" id="name" name=".." placeholder="Enter First Name">
            <input type="text" id="." name=".." placeholder="Enter Second Name">
            <br>
            <br>
            <label for="dob" >Date Of Birth:</label>
            <input type="date" id="DOB" name="DOB">
            <br>
            <br>
            <label for="mobile no." name="mobile no.">Mobile No:</label>
            <input type="text" id="no." name="no." placeholder="Enter Mobile No.">
            <br>
            <br>
            <label for="email id">Email ID:</label>
            <input type="text " placeholder="Enter Email ID">
            <br>
            <br>
            <label for="pass.">Password:</label>
            <input type="text" placeholder="Enter Password">
            <br>
            <br>
            <label for="gender">Gender:</label>
            <label for="male">male</label>      
            <input type="checkbox" id="gender" name="gender" style="margin-right: 40px';">
            <label for="female">female</label>
            <input type="checkbox" id="gender" name="gender" style="margin-right: 40px';">
            <label for="others">others</label>
            <input type="checkbox" id="gender" name="gender" style="margin-right: 40px';">
            <br>
            <br>
            <label for="department">Department:</label>
            <select id="department" name="department">
                <option value="cse">Computer Science and Engineering</option>
                <option value="mech">Mechanical Engineering</option>
                <option value="civil">Civil Engineering</option>
            </select>
            <br>
            <br>
            <label for="photo">Student Photo:</label>
            <input type="file" id="photo" name="photo">
            <br>
            <br>
            <label for="city">City:</label>
            <input type="text" id="city" name="city" placeholder="Enter City"> 
            <br>
            <br>
            <label for="state">State:</label>
            <input type="text" id="state" name="state" placeholder="Enter State">
            <br>   
            <br>
            <label for="address">Address:</label>
            <input type="text" id="address" name="address" placeholder="Enter Address" style="width: 500px;">
            <hr color="black">
            <br><br>
            <div align="center">
            <button>Register</button>
            
        </div>
     </form>
</body>
